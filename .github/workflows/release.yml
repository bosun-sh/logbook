name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: SemVer bump to publish
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  npm:
    name: Publish npm package
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Require main branch
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Manual releases must run from main. Current ref: $GITHUB_REF" >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Bump package version
        id: version
        run: |
          NEXT_VERSION="$(node - <<'NODE'
          const fs = require("node:fs")

          const bump = process.env.BUMP
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"))
          const match = /^(\d+)\.(\d+)\.(\d+)$/.exec(pkg.version)

          if (!match) {
            throw new Error(`package.json version must be stable SemVer, got ${pkg.version}`)
          }

          let major = Number(match[1])
          let minor = Number(match[2])
          let patch = Number(match[3])

          if (bump === "major") {
            major += 1
            minor = 0
            patch = 0
          } else if (bump === "minor") {
            minor += 1
            patch = 0
          } else if (bump === "patch") {
            patch += 1
          } else {
            throw new Error(`Unsupported bump: ${bump}`)
          }

          pkg.version = `${major}.${minor}.${patch}`
          fs.writeFileSync("package.json", `${JSON.stringify(pkg, null, 2)}\n`)
          process.stdout.write(pkg.version)
          NODE
          )"

          echo "version=${NEXT_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${NEXT_VERSION}" >> "$GITHUB_OUTPUT"
        env:
          BUMP: ${{ inputs.bump }}

      - name: Validate changelog and tag
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"

          if ! grep -F "## [${VERSION}]" CHANGELOG.md >/dev/null; then
            echo "CHANGELOG.md must contain a heading for ${VERSION} before release." >&2
            exit 1
          fi

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists locally." >&2
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag $TAG already exists on origin." >&2
            exit 1
          fi

      - name: Run release gate
        run: bun run ci:premerge

      - name: Commit version bump
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore(release): v${VERSION}"
          git push origin HEAD:main

      - name: Publish to npm
        run: npm publish --access public

      - name: Create and push tag
        run: |
          TAG="${{ steps.version.outputs.tag }}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"
